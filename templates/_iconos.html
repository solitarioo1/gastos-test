{% macro icono(nombre, tam=20, clase='') -%}
<svg class="icono {{ clase }}" xmlns="http://www.w3.org/2000/svg" width="{{ tam }}" height="{{ tam }}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#i-{{ nombre }}"/></svg>
{%- endmacro %}

{% macro logo(tam=32) -%}
<svg class="logo" xmlns="http://www.w3.org/2000/svg" width="{{ tam }}" height="{{ tam }}" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect width="64" height="64" rx="16" fill="#178a5f"/><text x="32" y="43" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="30" font-weight="800" fill="#fff">S/</text></svg>
{%- endmacro %}
